name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - zeus

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify single React version
        run: npm run verify:deps

      - name: Verify mobile Metro dependencies
        run: npm run verify:mobile

      - name: Verify no mobile Supabase client
        run: npm run verify:no-mobile-supabase

      - name: Verify no direct mock imports in mobile UI
        run: npm run verify:no-direct-mock-imports

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
