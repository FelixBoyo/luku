name: Security Hard Pass

on:
  pull_request:
  workflow_dispatch:

jobs:
  security-lane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run focused security tests
        run: npm test -- --run backend/http/redact.test.ts api/webhooks/paystack.test.ts api/ai/gemini.test.ts

      - name: Enforce audit threshold (HIGH/CRITICAL)
        run: npm audit --audit-level=high
